<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ギタイラボ・展示バックアップ移行の隔離テスト</title>
  <style>
  :root { color-scheme: light; }
  body { max-width: 690px; margin: 0 auto; padding: 20px 18px 48px; font: 16px/1.7 system-ui,sans-serif; background: #f7f7f3; color: #222; }
  h1 { font-size: 1.35rem; line-height:1.4; }
  button { padding: 13px 18px; background:#153f38; color:#fff; font:inherit; font-weight:700; border:0; border-radius:6px; min-height:48px; }
  button:disabled {opacity:.5;}
  pre { white-space:pre-wrap; overflow-wrap:anywhere; background:#fff; border:1px solid #ccc; border-radius:6px; padding:12px; min-height:60px; }
  .notice { border-left:4px solid #806229; padding-left:12px; }
  </style>
</head>
<body>
  <h1>ギタイラボ：バックアップDB移行の隔離テスト</h1>
  <p class="notice"><strong>展示用の本物のセーブデータは読み書きしません。</strong>毎回、名前を無作為生成した別のテスト専用DBを作って試験します。結果が出たらそのDBを削除します。実際の保存容量や長期間プレイの保証ではありません。</p>
  <p>Safari/iPadで、DB v2→v3の移行失敗時の復旧、別タブのブロック、旧v2の接続拒否、122項目の一時コピーと分割ファイルの検証を試します。押すまで何も実行しません。</p>
  <button type="button" id="run">隔離テストを実行</button>
  <p id="state" role="status" aria-live="polite">未実行</p>
  <pre id="log" aria-label="テストの詳細"></pre>
  <script src="backup_v2.js"></script>
  <script src="backup_checkpoint_v2.js"></script>
  <script src="backup_schema_rehearsal.js"></script>
  <script>
  (() => {
    'use strict';
    const button = document.getElementById('run');
    const state = document.getElementById('state');
    const log = document.getElementById('log');
    function add(message) { log.textContent += message + '\n'; }
    button.addEventListener('click', async () => {
      button.disabled = true;
      log.textContent = '';
      state.textContent = '隔離テスト中…';
      try {
        const result = await GitaiBackupSchemaRehearsal.runRehearsal({onPhase:add});
        add(JSON.stringify(result, null, 2));
        state.textContent = '成功：隔離DBの移行と分割書き出しの模擬データ往復を確認';
      } catch (error) {
        state.textContent = 'テスト失敗：原因をログで確認してください';
        add((error && (error.stack || error.message)) || String(error));
      } finally {
        button.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
