name: Specimen Genome preservation

on:
  push:
    branches: [main]
    paths:
      - index.html
      - js/pages_preview.js
      - js/entertainment_portal.js
      - js/solo_tutorial.js
      - css/solo_tutorial.css
      - tests/solo_tutorial.test.cjs
      - tests/specimen_genome.test.cjs
      - tests/solo_navigation.test.cjs
      - tests/touch_zoom.test.cjs
      - tests/specimen_name_ui.test.cjs
      - tests/portal_minimal_ui.test.cjs
      - css/portal_minimal.css
      - tests/shutter_visual.test.cjs
      - tests/generation_gallery.test.cjs
      - tests/rank_milestone.test.cjs
      - .github/workflows/specimen-genome-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specimen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify script syntax
        run: |
          node --check js/pages_preview.js
          node --check js/solo_tutorial.js
          node --check js/entertainment_portal.js
      - name: Exercise specimen save and legacy backfill
        run: node --test tests/specimen_genome.test.cjs tests/solo_navigation.test.cjs tests/touch_zoom.test.cjs tests/specimen_name_ui.test.cjs tests/portal_minimal_ui.test.cjs tests/shutter_visual.test.cjs tests/generation_gallery.test.cjs tests/rank_milestone.test.cjs tests/solo_tutorial.test.cjs
