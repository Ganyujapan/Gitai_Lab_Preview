name: GITAI SCORE v1 diagnostic

on:
  push:
    branches: [main]
    paths:
      - "research/calibration/analysis/**"
      - ".github/workflows/calibration-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Audit 1103 human ratings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run immutable dataset audit
        run: python3 research/calibration/analysis/analyze_v1.py --output-dir /tmp/gitai_score_audit
      - name: Upload human-readable and machine-readable reports
        uses: actions/upload-artifact@v4
        with:
          name: gitai-score-v1-diagnostic-20261015
          path: /tmp/gitai_score_audit/
          if-no-files-found: error
