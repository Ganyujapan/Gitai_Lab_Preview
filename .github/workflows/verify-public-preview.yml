name: Verify public preview bundle

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [security/public-runtime-only-20261019]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify release gate requirements
        run: node .github/scripts/verify-release-gate.cjs
      - name: CI-02 official GitHub Actions are pinned to reviewed SHAs
        run: node .github/scripts/verify-ci02-action-pins.cjs
      - name: Verify public source scope and app assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          required = [
              "index.html", "warning_fog.html", "manifest.webmanifest", ".nojekyll",
              "audio/gitailab_rainforest_soft_48k.ogg", "js/ambient_audio.js",
              "js/pages_preview.js", "js/entertainment_portal.js",
              "js/solo_tutorial.js",
              "config/konchu_univ_alpha.json",
              "data/evolution_models/continuous_v1/config.json",
              "data/evolution_models/morph_v1/config.json",
              "species/moth/species.json",
              "img/backgrounds/bg_leaf01.png",
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit(f"Missing public game assets: {missing}")
          for name in ("dev", "docs", "research", "tests"):
              if Path(name).exists():
                  raise SystemExit(f"Private development content still in public tree: {name}")
          for file in Path("config").rglob("*.json"):
              json.loads(file.read_text(encoding="utf-8"))
          for file in Path("data").rglob("*.json"):
              json.loads(file.read_text(encoding="utf-8"))
          for file in Path("environments").rglob("*.json"):
              conf=json.loads(file.read_text(encoding="utf-8"))
              bg=conf.get("background", {}).get("src", "")
              if bg and not Path(bg).is_file():
                  raise SystemExit(f"Missing environment background: {file} -> {bg}")
          # The title screen must be transparent ABOVE the black canvas.
          # A black covering layer hid both the moth and all ripple strokes.
          css = Path("css/entertainment_portal.css").read_text(encoding="utf-8")
          import re
          if not re.search(r"#entertainmentPortal\.portal-line-mode \.portal-intro\s*\{\s*background:\s*transparent", css):
              raise SystemExit("Title's overlay must stay transparent above the moth canvas")
          print("Public preview source scope and required assets: OK")
          PY
      - name: Verify author-news copy and fixed menu footer
        run: node .github/scripts/verify-author-news.cjs
      - name: SEC-F01 species labels render as text, not HTML
        run: node .github/scripts/verify-sec-f01-intro-labels.cjs
      - name: Verify warning tutorial copy and annotated screenshot-style frames
        run: node .github/scripts/verify-tutorial.cjs
      - name: Check recorded SFX content and playback logic
        run: node .github/scripts/verify-sfx.cjs
      - name: SFX-L02 reject stale and out-of-order audio resume after touch
        run: node .github/scripts/verify-sfx-stale-resume.cjs
      - name: SFX-L03 native AAC request is immediate on capture pointerdown
        run: node .github/scripts/verify-sfx-native-pointerdown.cjs
      - name: Verify native audio ended-listener cleanup and voice cap
        run: node .github/scripts/verify-native-sfx-listener-lifecycle.cjs
      - name: Verify native audio cannot replay cancelled pointer sounds
        run: node .github/scripts/verify-cancelled-tap-sfx.cjs
      - name: Verify fast iOS audio does not replay cancelled or stale pointer sounds
        run: node .github/scripts/verify-fast-sfx-cancelled-taps.cjs
      - name: Verify offline exhibit mode thumbnails and responsive tap targets
        run: node .github/scripts/verify-exhibit-mode-thumbnails.cjs
      - name: Verify exhibition generation counters and read-only theater
        run: node .github/scripts/verify-exhibit-landing-theater.cjs
      - name: Verify exhibition play buttons stand out without losing thumbnail space
        run: node .github/scripts/verify-exhibit-primary-play-cta.cjs
      - name: Verify exhibition theater's image and generation label remain consistent
        run: node .github/scripts/verify-exhibit-theater-image-label.cjs
      - name: Verify obsolete exhibition theater image errors cannot evict current decode
        run: node .github/scripts/verify-exhibit-theater-decode-cache.cjs
      - name: Verify exhibition theater reconstructs decoded frames after BFCache restore
        run: node .github/scripts/verify-exhibit-bfcache-theater.cjs
      - name: Verify theater snapshot version upgrades per evolution mode
        run: node .github/scripts/verify-theater-version-upgrade.cjs
      - name: PF06 theater uses bounded Blob URLs and rejects obsolete sessions
        run: node .github/scripts/verify-pf06-theater-url-window.cjs
      - name: PF06 synthetic performance rehearsal is safely isolated and URL bounded
        run: node .github/scripts/verify-pf06-perf-rehearsal.cjs
      - name: Verify specimen box ignores stale async reads and releases object URLs
        run: node .github/scripts/verify-specimen-async-display.cjs
      - name: Verify exhibition offline directory startup and handover navigation
        run: node .github/scripts/verify-exhibit-offline-navigation.cjs
      - name: Reject PWA reload while backup is unsaved or still preparing
        run: node .github/scripts/verify-exhibit-update-unsaved-backup.cjs
      - name: Verify exhibition Service Worker update lifecycle and offline cache safety
        run: node .github/scripts/verify-exhibit-update-lifecycle.cjs
      - name: Verify exhibition return-button IDs and paused-state escape
        run: node .github/scripts/verify-exhibit-return-controls.cjs
      - name: Verify exhibition visitor handover by actual saved generation
        run: node .github/scripts/verify-exhibit-visitor-handover.cjs
      - name: Inspect exhibit backup readiness read-only without allocating history
        run: node .github/scripts/verify-exhibit-backup-readiness.cjs
      - name: Verify exhibition backup cannot overwrite existing data with malformed JSON
        run: node .github/scripts/verify-exhibit-backup-validation.cjs
      - name: Verify exhibition backup restore reports partial success accurately
        run: node .github/scripts/verify-exhibit-restore-result.cjs
      - name: Verify exhibit admin opens DB without creation or upgrade and preflights archive size
        run: node .github/scripts/verify-exhibit-admin-nonmutating-open.cjs
      - name: Verify exhibition backup reads all stores in one atomic snapshot
        run: node .github/scripts/verify-exhibit-atomic-export.cjs
      - name: Prevent exporting exhibition backups that this release cannot import
        run: node .github/scripts/verify-exhibit-export-preflight.cjs
      - name: Verify iPad manual backup share/download requires separate tap after preparation
        run: node .github/scripts/verify-exhibit-manual-backup-handoff.cjs
      - name: Verify exporter refuses incomplete current PNG and DNA records
        run: node .github/scripts/verify-exhibit-export-validates-current.cjs
      - name: RE3-EXH-01 prevent warning-life backup while restore is pending
        run: node .github/scripts/verify-re3-exh01-pending-life-export.cjs
      - name: Preflight experimental split-backup manifest and parts (read-only)
        run: node .github/scripts/verify-exhibit-backup-v2-preflight.cjs
      - name: Verify synthetic iPad multipart file downloads and reselected SHA-256 integrity
        run: node .github/scripts/verify-exhibit-file-handoff-rehearsal.cjs
      - name: Test bounded multipart export writer with 20k+ histories and broken-file rejection
        run: node .github/scripts/verify-exhibit-backup-v2-writer.cjs
      - name: Verify isolated atomic checkpoint and bounded staged multipart export
        run: node .github/scripts/verify-exhibit-backup-v2-checkpoint.cjs
      - name: Ensure backup stage schema upgrade is gated by read-only runtime checks
        run: node .github/scripts/verify-exhibit-stage-upgrade-preflight.cjs
      - name: Verify additive v3 upgrade in sandbox-only browser rehearsal
        run: node .github/scripts/verify-exhibit-isolated-upgrade-rehearsal.cjs
      - name: Validate multipart semantic restore preflight using shipped genome and PNG checks
        run: node .github/scripts/verify-exhibit-v2-semantic-restore-preflight.cjs
      - name: Verify isolated multipart restore with atomic rollback under quota failure
        run: node .github/scripts/verify-exhibit-v2-isolated-atomic-restore.cjs
      - name: Verify opt-in Safari atomic restore rehearsal cannot reach production DB
        run: node .github/scripts/verify-exhibit-safari-atomic-rehearsal.cjs
      - name: Verify isolated warning-life post-restore retry and stale epoch rejection
        run: node .github/scripts/verify-exhibit-warning-life-recovery.cjs
      - name: Verify private-data-safe iPad isolated backup test report and user-triggered exports
        run: node .github/scripts/verify-exhibit-rehearsal-report.cjs
      - name: EV-08 verify capture elapsed times exclude poison and menu pauses
        run: node .github/scripts/verify-active-capture-time.cjs
      - name: Verify public battle and hide-and-seek removal
        run: node .github/scripts/verify-battle-seal.cjs
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js; do node --check "$file"; done
      - name: Test safe experiment reset and save flows
        run: node .github/scripts/verify-experiment-reset.cjs
      - name: Verify saved experiments preserve effective gameplay URL overrides
        run: node .github/scripts/verify-experiment-resume-options.cjs
      - name: Verify atomic experiment registry migration and two-tab save safety
        run: node .github/scripts/verify-experiment-registry.cjs
      - name: Verify experiment registry refreshes cannot recursively redraw the records dialog
        run: node .github/scripts/verify-experiment-records-notifications.cjs
      - name: Verify atomic and retryable config initialization for entertainment and exhibition
        run: node .github/scripts/verify-config-initialization.cjs
      - name: Preserve generations when saved moth images are missing
        run: node .github/scripts/verify-generation-recovery.cjs
      - name: Verify atomic founder commit and conservative interrupted-gen1 repair
        run: node .github/scripts/verify-founder-checkpoint.cjs
      - name: Verify compact diagnostic log hue mutation angles
        run: node .github/scripts/verify-diagnostic-hue-events.cjs
      - name: Verify neutrality of large brightness mutations after dark-bias removal
        run: node .github/scripts/verify-neutral-value-mutation.cjs
      - name: Verify independent poison and harmless mutation lotteries
        run: node .github/scripts/verify-warning-independent-mutations.cjs
      - name: Verify white warning founders inherit unbiased per-individual latent hues
        run: node .github/scripts/verify-warning-latent-founder-hues.cjs
      - name: RE3-EV-02 neutral seed and gen21 commit reject restore races atomically
        run: node .github/scripts/verify-warning-neutral-restore-cas.cjs
      - name: RE3-EV-01 reject invalid founder DNA before warning neutral evolution
        run: node .github/scripts/verify-warning-neutral-genome-validation.cjs
      - name: RE3-STO-01 restore epoch mismatch requires reload, never resubmit
        run: node .github/scripts/verify-re3-sto01-restore-reload.cjs
      - name: RE3-MODEL-01 rule provenance is generation-bound and legacy diagnostics remain untouched
        run: node .github/scripts/verify-re3-model01-rule-provenance.cjs
      - name: Reject concurrent or partial generation commits
        run: node .github/scripts/verify-atomic-generation-commit.cjs
      - name: Verify long-running generation IDs remain valid after generation 99999
        run: node .github/scripts/verify-long-generation-ids.cjs
      - name: Verify local evolution submission timeout does not cancel or replay uncertain commits
        run: node .github/scripts/verify-local-submit-timeout.cjs
      - name: Verify read-only local run status proves an atomic generation commit
        run: node .github/scripts/verify-local-run-status.cjs
      - name: Verify static backgrounds share one in-flight and decoded image per tab
        run: node .github/scripts/verify-static-background-cache.cjs
      - name: Verify static config cache is safe and live API uncached
        run: node .github/scripts/verify-static-config-cache.cjs
      - name: PF06 prefix queries scan only relevant IndexedDB keys
        run: node .github/scripts/verify-pf06-prefix-cursor.cjs
      - name: Reject aborted evolution and specimen transactions without hanging
        run: node .github/scripts/verify-indexeddb-aborts.cjs
      - name: Verify blocked experiment deletions settle only after actual result
        run: node .github/scripts/verify-blocked-experiment-deletion.cjs
      - name: STO-04 close late saved experiment database connections after blocked open
        run: node .github/scripts/verify-sto04-blocked-saved-open.cjs
      - name: Prevent missing DNA from being rewritten by image inference
        run: node .github/scripts/verify-genome-integrity.cjs
      - name: Build and validate Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html author_news.html warning_fog.html manifest.webmanifest .nojekyll _site/
          cp -R audio config css data environments img js species _site/
          test -f _site/index.html
          test -f _site/author_news.html
          test -f _site/css/author_news.css
          test -f _site/css/author_news_link.css
          test -f _site/warning_fog.html
          test -f _site/js/pages_preview.js
          test -f _site/audio/gitailab_rainforest_soft_48k.ogg
          test -f _site/img/backgrounds/bg_leaf01.png
          test ! -e _site/dev
          test ! -e _site/research
          test ! -e _site/docs
          test ! -e _site/tests
          python3 exhibit/build.py _site "${GITHUB_SHA}"
          node .github/scripts/verify-battle-seal.cjs _site
          test -f _site/exhibit/theater_canvas_20261026.js
          test -f _site/exhibit/theater_canvas_20261026.css
          node --check _site/exhibit/theater_canvas_20261026.js
          node --check _site/exhibit/game.js
          node --check _site/exhibit/admin.js
          node --check _site/exhibit/landing.js
          node --check _site/exhibit/js/pages_preview.js
          node --check _site/exhibit/js/entertainment_portal.js
          node --check _site/exhibit/sw.js
          node exhibit/verify_mutation_profile.cjs _site
          node .github/scripts/verify-re3-model01-rule-provenance.cjs _site
          test -f _site/exhibit/audio/gitailab_rainforest_soft_48k.ogg
          python3 - <<'PY'
          from pathlib import Path
          import json
          import hashlib
          ogg = Path("_site/audio/gitailab_rainforest_soft_48k.ogg").read_bytes()
          exhibit_ogg = Path("_site/exhibit/audio/gitailab_rainforest_soft_48k.ogg").read_bytes()
          assert ogg == exhibit_ogg, "Offline exhibit's audio is not identical to public source"
          assert len(ogg) == 287645, "Missing original Ogg"
          assert hashlib.sha256(ogg).hexdigest() == "7f9621d9b0e3cde76330ece9d5b24866efe2ad5f061ec6dc2af4e328a92323c3"
          site = Path("_site/exhibit")
          assets = json.loads((site / "precache.json").read_text())
          assert len(assets) > 30, len(assets)
          assert all((site / x).is_file() for x in assets)
          assert "audio/gitailab_rainforest_soft_48k.ogg" in assets
          game = (site / "game.html").read_text()
          assert "fonts.googleapis.com" not in game
          assert "admin.js" in assets and "admin.css" in assets
          assert "landing.js" in assets and "game.js" in assets
          engine = (site / "js/pages_preview.js").read_text()
          assert "gitai-exhibit-2026-" in engine
          assert "const BASE_DB_NAME =" in engine
          assert "const DB_NAME = 'gitai-exhibit-2026-' + " in engine
          assert "fonts.googleapis.com" not in (site / "js/entertainment_portal.js").read_text()
          print("Exhibition offline assets and isolated saves: OK")
          PY
