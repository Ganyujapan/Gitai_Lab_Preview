name: Public history cleanup (manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Run checks only (preflight) or rewrite history and remove old public branches (apply)"
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - apply
      confirmation:
        description: "For apply ONLY, enter DELETE_PUBLIC_HISTORY"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: public-history-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preflight and optional public-history reset
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REPOSITORY" != "Ganyujapan/Gitai_Lab_Preview" ]]; then
            echo "Wrong repository"; exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this action from main only"; exit 1
          fi
          if [[ "$OPERATION" != "preflight" && "$OPERATION" != "apply" ]]; then
            echo "Invalid operation"; exit 1
          fi

          current_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$current_sha" != "$EXPECTED_SHA" || "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "Main changed while preparing; refusing"; exit 1
          fi

          for file in index.html manifest.webmanifest .nojekyll js/pages_preview.js config/konchu_univ_alpha.json .github/workflows/deploy-pages.yml; do
            test -f "$file" || { echo "Missing runtime file: $file"; exit 1; }
          done
          for dir in dev docs research tests; do
            test ! -e "$dir" || { echo "Development content still present: $dir"; exit 1; }
          done

          mapfile -t branches < <(git ls-remote --heads origin | sed -E 's@^[^[:space:]]+[[:space:]]+refs/heads/@@')
          if [[ "${#branches[@]}" -lt 2 ]]; then
            echo "Expected at least main and legacy branches; refusing"; exit 1
          fi

          for branch in "${branches[@]}"; do
            case "$branch" in
              main|archive/*|backup/*|dev/*|security/*) ;;
              *) echo "Unexpected branch: $branch"; exit 1 ;;
            esac
          done

          if [[ -n "$(git ls-remote --tags origin)" ]]; then
            echo "Tags exist; audit them before rewriting history"; exit 1
          fi

          echo "Preflight passed: ${#branches[@]} branch refs; no tags; runtime files present."
          printf 'Branches to remove if applying:\n'
          printf '  %s\n' "${branches[@]}" | grep -v '^  main$'

          if [[ "$OPERATION" == "preflight" ]]; then
            echo "DRY RUN ONLY. Public repository was not modified."
            exit 0
          fi

          if [[ "$CONFIRMATION" != "DELETE_PUBLIC_HISTORY" ]]; then
            echo "Explicit confirmation does not match; refusing"; exit 1
          fi

          # Make a parentless root commit with precisely the same public files.
          tree_sha="$(git rev-parse HEAD^{tree})"
          root_sha="$(git -c user.name=gitai-public-bot -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit-tree "$tree_sha" -m 'Gitai Lab public runtime baseline')"
          if [[ "$(git rev-parse "$root_sha^{tree}")" != "$tree_sha" ]]; then
            echo "Tree mismatch; refusing"; exit 1
          fi
          if git cat-file -p "$root_sha" | grep -q '^parent '; then
            echo "Root commit unexpectedly has history"; exit 1
          fi
          git diff --exit-code "$EXPECTED_SHA" "$root_sha"

          echo "Replacing public main with a parentless commit."
          git push --force-with-lease="refs/heads/main:$EXPECTED_SHA" origin "$root_sha:refs/heads/main"

          # Delete only the allowlisted non-default branch refs.
          for branch in "${branches[@]}"; do
            [[ "$branch" == "main" ]] && continue
            git push origin ":refs/heads/$branch"
          done

          remaining="$(git ls-remote --heads origin | cut -f2 | grep -v '^refs/heads/main$' || true)"
          if [[ -n "$remaining" ]]; then
            printf 'Remaining old refs:\n%s\n' "$remaining"
            exit 1
          fi
          echo "Success: main now points to parentless root $root_sha and only main remains."
          echo "The private Gitai_Lab_Dev backup is untouched."
          echo "Follow up: remove this workflow file to trigger a fresh Pages deployment."
