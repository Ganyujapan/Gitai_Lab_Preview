<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>GITAI SCORE CALIBRATION LAB</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b0c;
      --panel: #111719;
      --line: rgba(184,247,255,.22);
      --accent: #b8f7ff;
      --muted: rgba(255,255,255,.62);
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
      color: #fff;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .wrap {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px;
    }
    header {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 4px; font-size: clamp(22px,4vw,34px); }
    h2 { margin: 0 0 10px; font-size: 18px; }
    p { line-height: 1.6; }
    .dev-badge {
      flex: 0 0 auto;
      border: 1px solid rgba(255,196,64,.5);
      color: #ffd77a;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
    }
    .lead { margin: 0; color: var(--muted); font-size: 13px; }
    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 430px) minmax(320px, 1fr);
      gap: 16px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
    }
    .game-wrap {
      position: relative;
      width: min(100%, 360px);
      margin: 0 auto;
      aspect-ratio: 9 / 16;
      border: 2px solid rgba(184,247,255,.34);
      border-radius: 10px;
      overflow: hidden;
      background: #111;
      touch-action: none;
    }
    #previewCanvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      cursor: crosshair;
    }
    .hint {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .controls {
      display: grid;
      gap: 10px;
    }
    .control-row {
      display: grid;
      grid-template-columns: 130px 1fr;
      align-items: center;
      gap: 10px;
    }
    label { color: var(--muted); font-size: 13px; }
    select, button, input, textarea {
      width: 100%;
      border: 1px solid rgba(184,247,255,.3);
      border-radius: 8px;
      background: rgba(255,255,255,.055);
      color: #fff;
      padding: 10px 11px;
      font: inherit;
    }
    button { cursor: pointer; }
    button.primary {
      background: rgba(184,247,255,.16);
      border-color: rgba(184,247,255,.55);
      font-weight: 700;
    }
    button.warn {
      border-color: rgba(255,196,64,.45);
      color: #ffd77a;
    }
    button:disabled { opacity: .45; cursor: default; }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .score-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 14px 0;
    }
    .score-card {
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      background: rgba(0,0,0,.18);
    }
    .score-label {
      color: var(--accent);
      font-size: 11px;
      letter-spacing: .08em;
    }
    .score-value {
      margin-top: 4px;
      font-size: clamp(38px,8vw,58px);
      font-weight: 800;
      line-height: 1;
    }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .metric {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 9px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 7px;
      font-size: 12px;
    }
    .moth-preview-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 12px;
      align-items: start;
      margin-top: 14px;
    }
    #mothCanvas {
      width: 140px;
      height: 140px;
      background:
        linear-gradient(45deg,#222 25%,transparent 25%),
        linear-gradient(-45deg,#222 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#222 75%),
        linear-gradient(-45deg,transparent 75%,#222 75%);
      background-size: 16px 16px;
      background-position: 0 0,0 8px,8px -8px,-8px 0;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 8px;
      image-rendering: pixelated;
    }
    .status {
      min-height: 48px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(0,0,0,.22);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }
    progress { width: 100%; height: 14px; }
    textarea {
      min-height: 180px;
      resize: vertical;
      font-family: ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size: 11px;
      line-height: 1.45;
    }
    .small { font-size: 11px; color: var(--muted); }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      .control-row { grid-template-columns: 112px 1fr; }
      .moth-preview-row { grid-template-columns: 112px 1fr; }
      #mothCanvas { width: 112px; height: 112px; }
    }

    @media (max-width: 800px) and (orientation: portrait) {
      .wrap {
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
      }
      .game-wrap {
        width: min(100%, 38svh, 360px);
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>GITAI SCORE CALIBRATION LAB</h1>
        <p class="lead">100点の到達可能性を調べるための開発専用ページ。本編のRun・標本箱・進化には影響しません。</p>
      </div>
      <div class="dev-badge">DEV ONLY</div>
    </header>

    <div class="layout">
      <section class="panel">
        <h2>背景上の目標地点</h2>
        <div class="game-wrap">
          <canvas id="previewCanvas" width="360" height="640"></canvas>
        </div>
        <p class="hint">背景をタップすると、その位置を中心に蛾を配置して最適化します。</p>
      </section>

      <section class="panel controls">
        <div class="control-row">
          <label for="environmentSelect">背景</label>
          <select id="environmentSelect">
            <option value="bark_001">樹皮 001</option>
            <option value="sand_001">砂地 001</option>
          </select>
        </div>
        <div class="control-row">
          <label for="iterationsSelect">探索回数</label>
          <select id="iterationsSelect">
            <option value="250">250（確認用）</option>
            <option value="1000" selected>1000</option>
            <option value="3000">3000</option>
            <option value="10000">10000（時間がかかります）</option>
          </select>
        </div>

        <div class="buttons">
          <button id="optimizeButton" class="primary" disabled>最適化開始</button>
          <button id="stopButton" class="warn" disabled>停止</button>
        </div>
        <progress id="progressBar" max="1" value="0"></progress>
        <div id="status" class="status">読み込み中…</div>

        <div class="score-grid">
          <div class="score-card">
            <div class="score-label">選択地点スコア</div>
            <div id="localScore" class="score-value">--</div>
          </div>
          <div class="score-card">
            <div class="score-label">現行 GITAI SCORE v1</div>
            <div id="globalScore" class="score-value">--</div>
          </div>
        </div>

        <div class="metrics">
          <div class="metric"><span>色</span><strong id="colorScore">--</strong></div>
          <div class="metric"><span>明るさ</span><strong id="valueScore">--</strong></div>
          <div class="metric"><span>模様・質感</span><strong id="textureScore">--</strong></div>
          <div class="metric"><span>輪郭</span><strong id="outlineScore">--</strong></div>
        </div>

        <div class="moth-preview-row">
          <canvas id="mothCanvas" width="128" height="128"></canvas>
          <div>
            <p class="small">
              左が現在のベスト個体です。選択地点スコアはその場所との一致度。
              現行GITAI SCORE v1は、本編と同じ候補地点評価・上位10地点平均です。
            </p>
            <button id="recalcButton" disabled>現行GITAI SCOREを再計算</button>
          </div>
        </div>

        <div class="control-row">
          <label>目標座標</label>
          <div id="targetText" class="small">--</div>
        </div>
        <div class="control-row">
          <label>試行</label>
          <div id="attemptText" class="small">0</div>
        </div>

        <h2>ベスト個体パラメータ</h2>
        <textarea id="genomeJson" readonly></textarea>
        <div class="buttons">
          <button id="copyButton" disabled>JSONをコピー</button>
          <button id="randomButton" disabled>ランダム個体を表示</button>
        </div>
      </section>
    </div>
  </main>
  <script src="./gitai_score_lab.js?v=20261014-3"></script>
</body>
</html>
