<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蛾レンダラー・PNG書き出し</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f1e9;color:#243c32;font-family:system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:32px 20px}h1{font-size:28px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:28px}textarea{width:100%;height:350px;padding:12px;font:13px monospace;border:1px solid #a7b4a9;border-radius:8px}button,input{font:inherit}button{padding:12px 16px;border:1px solid #829d89;border-radius:8px;background:white;color:#243c32;margin:4px}button.primary{background:#245d41;color:white}button:disabled{opacity:.4}#preview{display:grid;place-items:center;width:100%;height:320px;border:1px solid #b3b9ac;border-radius:12px;background-size:cover;background-position:center}.checker{background-color:white;background-image:conic-gradient(#ddd 25%,transparent 0 50%,#ddd 0 75%,transparent 0);background-size:20px 20px!important}canvas{width:128px;height:128px}#backgrounds{display:flex;flex-wrap:wrap}#backgrounds button{width:80px;font-size:13px;padding:4px}#backgrounds img,.swatch{display:block;width:68px;height:50px;object-fit:cover;border-radius:4px;margin-bottom:4px}button[aria-pressed=true]{outline:3px solid #245d41}#message{min-height:48px;white-space:pre-wrap}p{line-height:1.7}small{color:#56665b}@media(max-width:680px){.layout{grid-template-columns:1fr}main{padding:20px 14px}}
</style></head><body><main><small>開発者専用 / continuous_v1_frozen_v23</small><h1>蛾レンダラー＋PNG書き出し</h1><p>Calibration LabのGenome JSON（schema_version: 1）を読み込み、128×128pxの透過PNGを生成します。</p><div class="layout"><section><label for="json">Genome JSON</label><textarea id="json" spellcheck="false" placeholder='{"schema_version":1, ...}'></textarea><p><label>JSONファイルを読み込む <input id="file" type="file" accept=".json,application/json"></label></p><button id="render" class="primary">プレビューを生成</button><div id="message" role="status" aria-live="polite"></div></section><section><div id="preview" class="checker"></div><p>プレビュー背景</p><div id="backgrounds"></div><p><button id="png" disabled>透過PNGを保存</button><button id="save" disabled>JSONを保存</button></p><small>背景はプレビュー専用です。PNGには含まれません。JSONを編集した後は、プレビューを再生成してください。</small></section></div></main><script type="module" src="./moth_exporter.mjs"></script></body></html>
