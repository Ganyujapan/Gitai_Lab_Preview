<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#090b0c">
  <link rel="manifest" href="manifest.webmanifest">
  <title>ギタイラボ — 昆虫大学 α</title>
  <style>
    :root {
      --panel: rgba(8, 12, 14, 0.88);
      --line: rgba(255,255,255,0.18);
      --text: #fff;
      --muted: rgba(255,255,255,0.72);
      --accent: #b8f7ff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #090b0c;
      color: var(--text);
      font-family: 'PixelMplus', monospace;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      display: grid;
      place-items: center;
    }

    #stage {
      position: relative;
      width: min(100vw, calc(100dvh * 0.5625));
      height: min(100dvh, calc(100vw * 1.7777778));
      aspect-ratio: 9 / 16;
      background: #111;
      overflow: hidden;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      touch-action: manipulation;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: none;
      padding:
        calc(env(safe-area-inset-top) + 20px)
        18px
        calc(env(safe-area-inset-bottom) + 20px);
      background: rgba(0, 0, 0, 0.48);
      align-items: center;
      justify-content: center;
    }

    .overlay.visible { display: flex; }

    .panel {
      width: min(92%, 520px);
      max-height: 92%;
      overflow: hidden;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.42);
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      font-size: clamp(22px, 4.4vw, 34px);
      margin-bottom: 16px;
    }

    h2 {
      font-size: clamp(18px, 3.6vw, 28px);
      margin-bottom: 10px;
    }

    .lead {
      line-height: 1.8;
      font-size: clamp(14px, 2.7vw, 20px);
      margin-bottom: 20px;
    }

    .generation {
      color: var(--accent);
      font-size: clamp(14px, 2.8vw, 20px);
      margin-bottom: 14px;
    }

    .subtle {
      color: var(--muted);
      font-size: clamp(11px, 2.2vw, 16px);
      line-height: 1.55;
    }

    .score-card {
      margin: 4px 0 10px;
      padding: 18px 12px 16px;
      border: 1px solid rgba(184,247,255,0.30);
      border-radius: 14px;
      background: rgba(184,247,255,0.07);
    }

    .score-label {
      color: var(--muted);
      font-size: clamp(11px, 2.2vw, 15px);
      margin-bottom: 3px;
    }

    .score-main {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
    }

    #scoreValue {
      color: var(--accent);
      font-size: clamp(38px, 10vw, 62px);
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .score-unit {
      font-size: clamp(13px, 2.8vw, 18px);
    }

    .rank-text {
      margin-top: 10px;
      font-size: clamp(13px, 2.7vw, 18px);
      line-height: 1.45;
    }

    .name-entry {
      margin: 4px 0 8px;
      padding: 10px;
      border: 1px solid rgba(255,223,128,0.38);
      border-radius: 12px;
      background: rgba(255,223,128,0.07);
    }

    .name-entry[hidden] { display: none; }

    .name-entry-title {
      color: #ffe9a8;
      font-size: clamp(13px, 2.7vw, 18px);
      margin-bottom: 3px;
    }

    .name-entry-sub {
      color: var(--muted);
      font-size: clamp(10px, 2vw, 13px);
      margin-bottom: 8px;
    }

    .name-entry-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 7px;
    }

    #playerName {
      min-width: 0;
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 9px;
      background: rgba(0,0,0,0.28);
      color: #fff;
      font: inherit;
      font-size: 16px;
      padding: 9px 10px;
      -webkit-user-select: text;
      user-select: text;
    }

    #saveNameButton {
      width: auto;
      min-height: 42px;
      padding: 7px 12px;
      border-color: rgba(255,223,128,0.52);
      background: rgba(255,223,128,0.14);
      font-size: 13px;
    }

    .name-saved {
      margin: 7px 0 0;
      color: #ffe9a8;
      font-size: 11px;
    }

    .ranking-panel {
      width: min(94%, 520px);
      max-height: 92%;
    }

    .ranking-note {
      margin: 0 0 10px;
      color: rgba(255,255,255,0.48);
      font-size: clamp(9px, 1.8vw, 12px);
      line-height: 1.5;
    }

    .ranking-list {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      margin-bottom: 12px;
      text-align: left;
    }

    .ranking-group {
      padding: 9px 4px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }

    .ranking-group-head {
      display: grid;
      grid-template-columns: 72px 1fr;
      align-items: baseline;
      gap: 8px;
    }

    .ranking-rank {
      color: #ffe9a8;
      font-size: clamp(14px, 2.8vw, 18px);
    }

    .ranking-score {
      color: var(--accent);
      font-size: clamp(14px, 2.8vw, 18px);
      text-align: right;
    }

    .ranking-names {
      margin-top: 5px;
      padding-left: 80px;
      color: rgba(255,255,255,0.78);
      font-size: clamp(10px, 2.0vw, 13px);
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .ranking-empty {
      padding: 28px 8px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    button {
      width: 100%;
      min-height: 58px;
      flex: 0 0 auto;
      border: 1px solid rgba(184,247,255,0.48);
      border-radius: 12px;
      background: rgba(184,247,255,0.16);
      color: #fff;
      font-family: 'PixelMplus', monospace;
      font-size: clamp(15px, 2.8vw, 20px);
      padding: 12px 16px;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: 0.48;
    }

    .review-actions {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 6px;
    }

    .compare-action {
      border-color: rgba(255,223,128,0.52);
      background: rgba(255,196,64,0.18);
    }

    .continue-action {
      border-color: rgba(184,247,255,0.48);
      background: rgba(184,247,255,0.16);
    }

    .text-action {
      width: auto;
      min-height: 30px;
      align-self: center;
      margin: 0 0 7px;
      padding: 3px 8px;
      border-color: transparent;
      background: transparent;
      color: rgba(184,247,255,0.72);
      font-size: clamp(10px, 2vw, 13px);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .text-action:active {
      color: #fff;
    }

    .author-news-teaser {
      flex: 0 0 auto;
      margin-top: 6px;
      padding: 5px 8px;
      text-align: center;
      color: rgba(184,247,255,0.44);
      font-size: clamp(9px, 1.55vw, 11px);
      letter-spacing: 0.04em;
      line-height: 1.2;
    }

    .author-news-teaser[hidden] {
      display: none;
    }

    #evolutionOverlay {
      z-index: 30;
      background: rgba(5, 8, 9, 0.97);
      cursor: pointer;
    }

    .evolution-panel {
      width: min(96%, 540px);
      max-height: 96%;
      padding: 14px;
    }

    .evolution-title {
      margin: 0 0 4px;
      font-size: clamp(17px, 3.2vw, 24px);
    }

    .evolution-hint {
      margin: 0 0 8px;
      color: rgba(255,255,255,0.42);
      font-size: clamp(9px, 1.7vw, 12px);
    }

    .evolution-columns {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      min-height: 0;
    }

    .evolution-columns::before {
      content: "";
      position: absolute;
      top: 24px;
      bottom: 0;
      left: 50%;
      width: 1px;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.16);
      pointer-events: none;
    }

    .evolution-column {
      min-width: 0;
      padding: 0 5px;
    }

    .evolution-column h3 {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: clamp(10px, 1.9vw, 14px);
      font-weight: normal;
    }

    .evolution-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 2px;
    }

    .evolution-grid img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      image-rendering: pixelated;
      background: rgba(255,255,255,0.045);
      border-radius: 3px;
    }

    #errorText {
      color: #ffb2b2;
      white-space: pre-wrap;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="ギタイラボ">
    <canvas id="gameCanvas" width="360" height="640"></canvas>

    <section id="startOverlay" class="overlay visible">
      <div class="panel">
        <div id="startGeneration" class="generation">GENERATION --</div>
        <h1>ギタイラボ</h1>
        <p id="introLead" class="lead">見つけた生き物を<br>タップしてください。</p>
        <p id="introSubtle" class="subtle">見つからなかった個体が生き残り、<br>次の世代へ子孫を残します。</p>
        <button id="startButton" type="button" disabled>準備中…</button>
      </div>
    </section>

    <section id="reviewOverlay" class="overlay">
      <div class="panel">
        <div id="reviewGeneration" class="generation">GENERATION --</div>
        <h2 id="reviewTitle">成績発表</h2>
        <p id="reviewMessage" class="subtle"></p>

        <div class="score-card">
          <div class="score-label">1秒あたり</div>
          <div class="score-main">
            <span id="scoreValue">--</span>
            <span class="score-unit">匹 捕食</span>
          </div>
          <div id="rankText" class="rank-text">順位を計算中…</div>
        </div>

        <div id="nameEntry" class="name-entry" hidden>
          <div class="name-entry-title">歴代20位以内！</div>
          <div class="name-entry-sub">なまえをのこせます</div>
          <div class="name-entry-row">
            <input id="playerName" type="text" maxlength="12" autocomplete="off" placeholder="なまえ">
            <button id="saveNameButton" type="button">記録</button>
          </div>
          <p id="nameSaved" class="name-saved" hidden>なまえを記録しました</p>
        </div>

        <button id="rankingButton" class="text-action" type="button">ランキングを見る</button>
        <p id="evolutionStatus" class="subtle"></p>

        <div class="review-actions">
          <button id="compareButton" class="compare-action" type="button" hidden>世代を比較する</button>
          <button id="continueButton" class="continue-action" type="button">次の人へ</button>
        </div>

        <div id="authorNewsTeaser" class="author-news-teaser" hidden>
          作者からのお知らせ
        </div>
      </div>
    </section>

    <section id="evolutionOverlay" class="overlay" aria-label="世代比較">
      <div class="panel evolution-panel">
        <h2 class="evolution-title">第1世代から現在まで</h2>
        <p class="evolution-hint">画面のどこかをタップすると戻ります</p>
        <div class="evolution-columns">
          <section class="evolution-column">
            <h3>第1世代</h3>
            <div id="firstGenerationGrid" class="evolution-grid"></div>
          </section>
          <section class="evolution-column">
            <h3 id="latestGenerationTitle">現在世代</h3>
            <div id="latestGenerationGrid" class="evolution-grid"></div>
          </section>
        </div>
      </div>
    </section>

    <section id="rankingOverlay" class="overlay" aria-label="歴代ランキング">
      <div class="panel ranking-panel">
        <h2>歴代ランキング</h2>
        <p class="ranking-note">同じ捕食数は同順位です<br>テスト版では、この端末・同じ制限時間の記録を表示します</p>
        <div id="rankingList" class="ranking-list"></div>
        <button id="rankingCloseButton" type="button">戻る</button>
      </div>
    </section>

    <section id="errorOverlay" class="overlay">
      <div class="panel">
        <h2>エラー</h2>
        <p id="errorText"></p>
        <button id="reloadButton" type="button">再読み込み</button>
      </div>
    </section>
  </main>

<script src="js/gen1_01.js"></script>
<script src="js/gen1_02.js"></script>
<script src="js/gen1_03.js"></script>
<script src="js/gen1_04.js"></script>
<script src="js/gen1_05.js"></script>
<script src="js/gen1_06.js"></script>
<script src="js/mask_data.js"></script>
<script src="js/pages_preview.js"></script>
<script>
(() => {
  'use strict';

  let CONFIG = null;
  let speciesConfig = null;
  let environmentConfig = null;
  let submitTimeoutMs = 30000;
  let scaledForbiddenAreas = [];

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const startOverlay = document.getElementById('startOverlay');
  const startGeneration = document.getElementById('startGeneration');
  const startButton = document.getElementById('startButton');
  const introLead = document.getElementById('introLead');
  const introSubtle = document.getElementById('introSubtle');

  const reviewOverlay = document.getElementById('reviewOverlay');
  const reviewGeneration = document.getElementById('reviewGeneration');
  const reviewTitle = document.getElementById('reviewTitle');
  const reviewMessage = document.getElementById('reviewMessage');
  const scoreValue = document.getElementById('scoreValue');
  const rankText = document.getElementById('rankText');
  const nameEntry = document.getElementById('nameEntry');
  const playerName = document.getElementById('playerName');
  const saveNameButton = document.getElementById('saveNameButton');
  const nameSaved = document.getElementById('nameSaved');
  const rankingButton = document.getElementById('rankingButton');
  const evolutionStatus = document.getElementById('evolutionStatus');
  const continueButton = document.getElementById('continueButton');
  const compareButton = document.getElementById('compareButton');
  const authorNewsTeaser = document.getElementById('authorNewsTeaser');

  const evolutionOverlay = document.getElementById('evolutionOverlay');
  const firstGenerationGrid = document.getElementById('firstGenerationGrid');
  const latestGenerationGrid = document.getElementById('latestGenerationGrid');
  const latestGenerationTitle = document.getElementById('latestGenerationTitle');

  const rankingOverlay = document.getElementById('rankingOverlay');
  const rankingList = document.getElementById('rankingList');
  const rankingCloseButton = document.getElementById('rankingCloseButton');

  const errorOverlay = document.getElementById('errorOverlay');
  const errorText = document.getElementById('errorText');
  const reloadButton = document.getElementById('reloadButton');

  const GAME_WIDTH = canvas.width;
  const GAME_HEIGHT = canvas.height;

  const state = {
    currentGenerationId: 'gen00001',
    generationNumber: 1,
    backgroundImage: null,
    mothImages: [],
    rounds: [],
    currentRoundIndex: 0,
    activeMoths: [],
    eatenIndices: new Set(),
    allSurvivorIndices: [],
    roundRecords: [],
    roundTapEvents: [],
    roundStartedAt: 0,
    roundActive: false,
    remainingSeconds: 0,
    countdownIntervalId: null,
    roundTimeoutId: null,
    nextGenerationId: null,
    submitStatus: 'idle',
    runId: null,
    scoreRecordId: null,
    scoreSummary: null,
    bootReady: false,
    uiTransitionLocked: false,
    wakeLock: null,
  };

  function applyAppConfig(appConfig) {
    if (!appConfig || !appConfig.game || !appConfig.species || !appConfig.environment) {
      throw new Error('アプリ設定が不正です');
    }

    speciesConfig = appConfig.species;
    environmentConfig = appConfig.environment;
    submitTimeoutMs = Number(
      appConfig.network?.submit_timeout_ms || 30000
    );

    const game = appConfig.game;
    const background = environmentConfig.background;
    const population = Number(speciesConfig.population_size);
    const rounds = Number(game.rounds_per_generation);
    const perRound = Number(game.individuals_per_round);

    if (!Number.isInteger(population) || population <= 0) {
      throw new Error('population_size が不正です');
    }
    if (rounds * perRound !== population) {
      throw new Error('ラウンド構成と個体数が一致しません');
    }

    CONFIG = Object.freeze({
      ROUND_LIMIT: rounds,
      ROUND_TIME_MS: Number(game.round_time_ms),
      INTER_ROUND_DELAY_MS: Number(
        game.inter_round_delay_ms ?? 250
      ),
      MOTHS_PER_ROUND: perRound,
      TOTAL_MOTHS: population,
      MOTH_SIZE: Number(game.display_size_px),
      MOTH_Y_MIN: Number(game.display_y_min_px ?? 0),
      MOTH_Y_MAX: Number(game.display_y_max_px),
      HUD_BAR_HEIGHT: Number(game.hud_bar_height_px ?? 36),
      HUD_CLEARANCE: Number(game.hud_clearance_px ?? 40),
      BG_TRUE_WIDTH: Number(background.source_width),
      BG_TRUE_HEIGHT: Number(background.source_height),
      BACKGROUND_SRC: String(background.src),
    });

    const sx = GAME_WIDTH / CONFIG.BG_TRUE_WIDTH;
    const sy = GAME_HEIGHT / CONFIG.BG_TRUE_HEIGHT;
    scaledForbiddenAreas = (environmentConfig.forbidden_areas || []).map((area) => ({
      x: Number(area.x) * sx,
      y: Number(area.y) * sy,
      width: Number(area.width) * sx,
      height: Number(area.height) * sy,
    }));

    const label = String(speciesConfig.display_name_ja || '生き物');
    document.title = appConfig.title || 'ギタイラボ';
    introLead.innerHTML = `見つけた${label}を<br>タップしてください。`;
    introSubtle.innerHTML = `見つからなかった${label}が生き残り、<br>次の世代へ子孫を残します。`;
  }

  async function fetchAppConfig() {
    const res = await fetch('/api/app_config', { cache: 'no-store' });
    if (!res.ok) throw new Error(`設定を取得できません (HTTP ${res.status})`);
    const data = await res.json();
    applyAppConfig(data);
  }

  function individualAssetPath(generationId, index) {
    const template = String(speciesConfig.image.asset_template || '');
    const path = template
      .replaceAll('{generation_id}', generationId)
      .replaceAll('{index_2d}', String(index).padStart(2, '0'))
      .replaceAll('{index}', String(index));
    return window.GitaiPagesPreview
      ? window.GitaiPagesPreview.resolveAsset(generationId, index, path)
      : path;
  }

  function generationLabel() {
    return `GENERATION ${String(state.generationNumber).padStart(5, '0')}`;
  }

  function leaderboardKey() {
    return `gitai-preview-leaderboard-v2-${CONFIG.ROUND_TIME_MS}ms`;
  }

  function activePlaySeconds() {
    return (CONFIG.ROUND_LIMIT * CONFIG.ROUND_TIME_MS) / 1000;
  }

  function scoreRate(eatenCount) {
    const seconds = activePlaySeconds();
    return seconds > 0 ? eatenCount / seconds : 0;
  }

  function ensureRunId() {
    if (!state.runId) {
      state.runId = `exhibit_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    }
    return state.runId;
  }

  function loadLeaderboard() {
    try {
      const parsed = JSON.parse(localStorage.getItem(leaderboardKey()) || '[]');
      if (!Array.isArray(parsed)) return [];
      return parsed.filter((record) =>
        record &&
        typeof record.id === 'string' &&
        Number.isInteger(Number(record.eaten))
      );
    } catch (_) {
      return [];
    }
  }

  function saveLeaderboard(records) {
    try {
      localStorage.setItem(leaderboardKey(), JSON.stringify(records));
      return true;
    } catch (_) {
      return false;
    }
  }

  function recordCurrentScore() {
    const eaten = state.eatenIndices.size;
    const id = ensureRunId();
    let records = loadLeaderboard();
    let record = records.find((item) => item.id === id);

    if (!record) {
      record = {
        id,
        generation_id: state.currentGenerationId,
        eaten,
        rate: scoreRate(eaten),
        name: '',
        created_at: Date.now(),
      };
      records.push(record);
      saveLeaderboard(records);
    }

    const rank = 1 + records.filter(
      (item) => Number(item.eaten) > eaten
    ).length;

    state.scoreRecordId = id;
    state.scoreSummary = {
      eaten,
      rate: scoreRate(eaten),
      rank,
      total: records.length,
      eligible: rank <= 20,
    };
    return state.scoreSummary;
  }

  function renderScoreSummary() {
    const summary = state.scoreSummary || recordCurrentScore();
    scoreValue.textContent = summary.rate.toFixed(2);
    rankText.textContent =
      `全${summary.total.toLocaleString('ja-JP')}プレイ中 `
      + `${summary.rank.toLocaleString('ja-JP')}位`;

    const records = loadLeaderboard();
    const current = records.find((item) => item.id === state.scoreRecordId);
    const existingName = current && typeof current.name === 'string'
      ? current.name.trim()
      : '';

    nameEntry.hidden = !summary.eligible;
    nameSaved.hidden = true;
    saveNameButton.disabled = false;
    playerName.disabled = false;
    playerName.value = existingName;

    if (summary.eligible && existingName) {
      nameSaved.hidden = false;
      playerName.disabled = true;
      saveNameButton.disabled = true;
    }
  }

  function saveCurrentName() {
    if (!state.scoreRecordId || !state.scoreSummary?.eligible) return;

    const name = playerName.value.trim().slice(0, 12);
    if (!name) {
      playerName.focus();
      return;
    }

    const records = loadLeaderboard();
    const record = records.find((item) => item.id === state.scoreRecordId);
    if (!record) return;

    record.name = name;
    saveLeaderboard(records);
    playerName.value = name;
    playerName.disabled = true;
    saveNameButton.disabled = true;
    nameSaved.hidden = false;
  }

  function renderRanking() {
    const records = loadLeaderboard()
      .slice()
      .sort((a, b) =>
        Number(b.eaten) - Number(a.eaten)
        || Number(a.created_at || 0) - Number(b.created_at || 0)
      );

    rankingList.innerHTML = '';
    if (!records.length) {
      const empty = document.createElement('div');
      empty.className = 'ranking-empty';
      empty.textContent = 'まだ記録がありません。';
      rankingList.appendChild(empty);
      return;
    }

    let consumed = 0;
    let index = 0;

    while (index < records.length) {
      const eaten = Number(records[index].eaten);
      const group = [];
      while (
        index < records.length &&
        Number(records[index].eaten) === eaten
      ) {
        group.push(records[index]);
        index += 1;
      }

      const rank = consumed + 1;
      consumed += group.length;
      if (rank > 20) break;

      const block = document.createElement('div');
      block.className = 'ranking-group';

      const head = document.createElement('div');
      head.className = 'ranking-group-head';

      const rankEl = document.createElement('div');
      rankEl.className = 'ranking-rank';
      rankEl.textContent = `${rank}位`;

      const scoreEl = document.createElement('div');
      scoreEl.className = 'ranking-score';
      scoreEl.textContent = `1秒あたり ${scoreRate(eaten).toFixed(2)}匹`;

      head.append(rankEl, scoreEl);
      block.appendChild(head);

      const names = group
        .map((record) => String(record.name || '').trim())
        .filter(Boolean);
      const unnamed = group.length - names.length;

      const namesEl = document.createElement('div');
      namesEl.className = 'ranking-names';
      const displayNames = [...names];
      if (unnamed === 1) displayNames.push('NO NAME');
      else if (unnamed > 1) displayNames.push(`NO NAME ×${unnamed}`);
      namesEl.textContent = displayNames.join(' / ');

      block.appendChild(namesEl);
      rankingList.appendChild(block);
    }
  }

  function showRanking() {
    renderRanking();
    rankingOverlay.classList.add('visible');
  }

  function cacheBustUrl(path) {
    const value = String(path);
    if (value.startsWith('blob:') || value.startsWith('data:')) return value;
    const separator = value.includes('?') ? '&' : '?';
    return `${value}${separator}v=${Date.now()}`;
  }

  async function requestScreenWakeLock() {
    if (!('wakeLock' in navigator)) return;

    try {
      if (state.wakeLock && !state.wakeLock.released) return;
      state.wakeLock = await navigator.wakeLock.request('screen');
      state.wakeLock.addEventListener('release', () => {
        state.wakeLock = null;
      });
    } catch (_) {
      // Optional enhancement only. The game remains usable when Safari,
      // battery policy, or device settings reject the request.
      state.wakeLock = null;
    }
  }

  function showFatal(message) {
    clearTimers();
    state.roundActive = false;
    errorText.textContent = message;
    errorOverlay.classList.add('visible');
  }

  function clearTimers() {
    if (state.countdownIntervalId !== null) {
      clearInterval(state.countdownIntervalId);
      state.countdownIntervalId = null;
    }
    if (state.roundTimeoutId !== null) {
      clearTimeout(state.roundTimeoutId);
      state.roundTimeoutId = null;
    }
  }

  function shuffle(array) {
    const a = [...array];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildRounds() {
    const order = shuffle(Array.from({ length: CONFIG.TOTAL_MOTHS }, (_, i) => i + 1));
    state.rounds = [];
    for (let r = 0; r < CONFIG.ROUND_LIMIT; r++) {
      state.rounds.push(order.slice(r * CONFIG.MOTHS_PER_ROUND, (r + 1) * CONFIG.MOTHS_PER_ROUND));
    }
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error(`画像を読み込めません: ${src}`));
      img.src = src;
    });
  }

  async function fetchCurrentGeneration() {
    const res = await fetch('/api/current_generation', { cache: 'no-store' });
    if (!res.ok) throw new Error(`世代情報を取得できません (HTTP ${res.status})`);
    const data = await res.json();
    const id = String(data.current_generation_id || '');
    if (!/^gen\d{5}$/.test(id)) throw new Error('世代IDが不正です');
    return id;
  }

  async function preloadAssets() {
    state.backgroundImage = await loadImage(cacheBustUrl(CONFIG.BACKGROUND_SRC));

    const promises = [];
    for (let i = 1; i <= CONFIG.TOTAL_MOTHS; i++) {
      const src = cacheBustUrl(individualAssetPath(state.currentGenerationId, i));
      promises.push(loadImage(src));
    }

    state.mothImages = await Promise.all(promises);
  }

  function isInForbiddenArea(x, y, size) {
    return scaledForbiddenAreas.some((a) => !(
      x + size <= a.x ||
      x >= a.x + a.width ||
      y + size <= a.y ||
      y >= a.y + a.height
    ));
  }

  function isOverlapping(x, y, size, moths) {
    return moths.some((m) => !(
      x + size <= m.x ||
      x >= m.x + m.size ||
      y + size <= m.y ||
      y >= m.y + m.size
    ));
  }

  function placeRoundMoths() {
    const indices = state.rounds[state.currentRoundIndex];
    if (!indices || indices.length !== CONFIG.MOTHS_PER_ROUND) {
      throw new Error('ラウンド個体データが不正です');
    }

    const placed = [];
    let attempts = 0;
    const maxAttempts = 10000;
    const size = CONFIG.MOTH_SIZE;
    const hudSafeTop =
      CONFIG.HUD_BAR_HEIGHT + CONFIG.HUD_CLEARANCE;
    const hudSafeBottom =
      GAME_HEIGHT - CONFIG.HUD_BAR_HEIGHT - CONFIG.HUD_CLEARANCE;

    const yMin = Math.max(
      0,
      CONFIG.MOTH_Y_MIN,
      hudSafeTop
    );
    const yMax = Math.max(
      yMin,
      Math.min(
        CONFIG.MOTH_Y_MAX,
        hudSafeBottom,
        GAME_HEIGHT
      ) - size
    );
    const yRange = yMax - yMin;

    while (placed.length < CONFIG.MOTHS_PER_ROUND && attempts < maxAttempts) {
      const x = Math.random() * (GAME_WIDTH - size);
      const y = yMin + Math.random() * yRange;

      if (!isInForbiddenArea(x, y, size) && !isOverlapping(x, y, size, placed)) {
        const index = indices[placed.length];
        placed.push({
          index,
          x, y, size,
          clicked: false,
          image: state.mothImages[index - 1],
        });
      }
      attempts++;
    }

    if (placed.length !== CONFIG.MOTHS_PER_ROUND) {
      throw new Error(`${CONFIG.MOTHS_PER_ROUND}個体を安全に配置できませんでした`);
    }

    state.activeMoths = placed;
  }

  function drawBackground() {
    if (!state.backgroundImage) {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
      return;
    }
    ctx.drawImage(state.backgroundImage, 0, 0, GAME_WIDTH, GAME_HEIGHT);
  }

  function drawMoths() {
    for (const moth of state.activeMoths) {
      if (!moth.clicked) {
        ctx.drawImage(moth.image, moth.x, moth.y, moth.size, moth.size);
      }
    }
  }

  function drawHud() {
    ctx.save();

    ctx.fillStyle = 'rgba(0,0,0,0.52)';
    ctx.fillRect(0, 0, GAME_WIDTH, CONFIG.HUD_BAR_HEIGHT);
    ctx.fillRect(
      0,
      GAME_HEIGHT - CONFIG.HUD_BAR_HEIGHT,
      GAME_WIDTH,
      CONFIG.HUD_BAR_HEIGHT
    );

    ctx.fillStyle = '#fff';
    ctx.font = '13px "PixelMplus", monospace';
    ctx.textBaseline = 'middle';

    ctx.textAlign = 'left';
    const hudMidY = CONFIG.HUD_BAR_HEIGHT / 2;
    ctx.fillText(generationLabel(), 12, hudMidY);

    ctx.textAlign = 'left';
    ctx.fillText(
      `ROUND ${state.currentRoundIndex + 1} / ${CONFIG.ROUND_LIMIT}`,
      12,
      GAME_HEIGHT - hudMidY
    );

    ctx.textAlign = 'right';
    ctx.fillText(
      `残り ${state.remainingSeconds} 秒`,
      GAME_WIDTH - 12,
      GAME_HEIGHT - hudMidY
    );

    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    drawBackground();
    if (state.roundActive) drawMoths();
    drawHud();
  }

  function startRound() {
    reviewOverlay.classList.remove('visible');
    clearTimers();

    try {
      placeRoundMoths();
    } catch (err) {
      showFatal(err.message || String(err));
      return;
    }

    state.remainingSeconds = Math.ceil(CONFIG.ROUND_TIME_MS / 1000);
    state.roundTapEvents = [];
    state.roundStartedAt = performance.now();
    state.roundActive = true;
    render();

    state.countdownIntervalId = setInterval(() => {
      state.remainingSeconds = Math.max(0, state.remainingSeconds - 1);
      render();
    }, 1000);

    state.roundTimeoutId = setTimeout(endRound, CONFIG.ROUND_TIME_MS);
  }

  function endRound() {
    if (!state.roundActive) return;

    clearTimers();
    state.roundActive = false;

    const roundSurvivors = state.activeMoths
      .filter((m) => !m.clicked)
      .map((m) => m.index)
      .sort((a, b) => a - b);

    state.roundRecords.push({
      round_index: state.currentRoundIndex + 1,
      configured_duration_ms: CONFIG.ROUND_TIME_MS,
      individuals: state.activeMoths.map((m) => ({
        index: m.index,
        x: Math.round(m.x * 100) / 100,
        y: Math.round(m.y * 100) / 100,
        size: m.size,
        eaten: Boolean(m.clicked),
      })),
      tap_events: state.roundTapEvents.map((event) => ({ ...event })),
    });

    state.allSurvivorIndices.push(...roundSurvivors);
    render();

    const isFinalRound = state.currentRoundIndex === CONFIG.ROUND_LIMIT - 1;
    if (isFinalRound) {
      showResults();
      sendEvolutionData();
    } else {
      state.uiTransitionLocked = true;
      state.currentRoundIndex += 1;

      setTimeout(() => {
        state.uiTransitionLocked = false;
        startRound();
      }, CONFIG.INTER_ROUND_DELAY_MS);
    }
  }

  function fillEvolutionGrid(element, generationId) {
    element.innerHTML = '';
    for (let i = 1; i <= CONFIG.TOTAL_MOTHS; i++) {
      const img = document.createElement('img');
      img.src = cacheBustUrl(individualAssetPath(generationId, i));
      img.alt = `${generationId} 個体 ${i}`;
      element.appendChild(img);
    }
  }

  function showEvolutionComparison() {
    const latestId = state.nextGenerationId || state.currentGenerationId;
    const latestNumber = Number(latestId.slice(3));

    fillEvolutionGrid(firstGenerationGrid, 'gen00001');
    fillEvolutionGrid(latestGenerationGrid, latestId);
    latestGenerationTitle.textContent = `第${latestNumber}世代`;
    evolutionOverlay.classList.add('visible');
  }

  function showResults() {
    state.uiTransitionLocked = false;
    reviewGeneration.textContent = generationLabel();
    reviewTitle.textContent = '成績発表';
    reviewMessage.textContent = '';
    evolutionStatus.textContent = '';
    compareButton.hidden = true;
    authorNewsTeaser.hidden = true;

    recordCurrentScore();
    renderScoreSummary();

    continueButton.textContent = '次世代を生成中…';
    continueButton.disabled = true;
    reviewOverlay.classList.add('visible');
  }

  async function sendEvolutionData() {
    state.submitStatus = 'sending';

    const eaten = Array.from(state.eatenIndices).sort((a, b) => a - b);
    const runId = ensureRunId();

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(
        () => controller.abort(),
        submitTimeoutMs,
      );

      let res;
      try {
        res = await fetch('/api/submit_run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          cache: 'no-store',
          signal: controller.signal,
          body: JSON.stringify({
            run_id: runId,
            generation_id: state.currentGenerationId,
            eaten_indices: eaten,
            round_records: state.roundRecords,
          }),
        });
      } finally {
        clearTimeout(timeoutId);
      }

      const data = await res.json().catch(() => ({}));

      if (
        res.status === 422 &&
        data.error === 'insufficient_survivors' &&
        data.retry_same_generation
      ) {
        state.submitStatus = 'retry_generation';
        authorNewsTeaser.hidden = true;
        state.nextGenerationId = null;

        const survivorCount = Number(data.survivor_count || 0);
        const label = String(speciesConfig.display_name_ja || '個体');
        reviewTitle.textContent = 'この世代はもう一度';
        reviewMessage.textContent =
          `生き残った${label}が${survivorCount}匹だったため、繁殖が成立しませんでした。`;
        evolutionStatus.textContent =
          '世代は進みません。同じ60個体で、もう一度5ラウンドを行います。';
        state.uiTransitionLocked = false;
        continueButton.textContent = '同じ世代でもう一度';
        continueButton.disabled = false;
        compareButton.hidden = false;
        return;
      }

      if (
        res.status === 409 &&
        data.error === 'generation_mismatch'
      ) {
        state.submitStatus = 'stale_generation';
        authorNewsTeaser.hidden = true;
        state.nextGenerationId = null;

        reviewTitle.textContent = '世代が更新されています';
        reviewMessage.textContent =
          'サーバー側では別の世代へ進んでいます。現在の結果は送信しません。';
        evolutionStatus.textContent =
          '最新世代 '
          + String(data.server_current_generation_id || '')
          + ' を読み込み直してください。';
        state.uiTransitionLocked = false;
        continueButton.textContent = '最新世代を読み込む';
        continueButton.disabled = false;
        compareButton.hidden = false;
        return;
      }

      if (
        res.status === 507 &&
        data.error === 'insufficient_storage'
      ) {
        state.submitStatus = 'failed';
        authorNewsTeaser.hidden = true;
        state.nextGenerationId = null;

        reviewTitle.textContent = 'スタッフにお知らせください';
        reviewMessage.textContent =
          'Macの保存容量が安全基準を下回ったため、世代更新を停止しました。';
        evolutionStatus.textContent =
          '空き '
          + String(data.free_disk_mb ?? '?')
          + ' MB / 必要 '
          + String(data.minimum_free_disk_mb ?? '?')
          + ' MB。現在世代は保持されています。';
        state.uiTransitionLocked = false;
        continueButton.textContent = '容量確認後にもう一度';
        continueButton.disabled = false;
        compareButton.hidden = false;
        return;
      }

      if (!res.ok) {
        throw new Error(data.error ? `${data.error} (HTTP ${res.status})` : `HTTP ${res.status}`);
      }

      state.nextGenerationId = String(data.next_generation_id || '');
      state.submitStatus = 'success';
      authorNewsTeaser.hidden = false;
      evolutionStatus.textContent =
        `次の世代 ${state.nextGenerationId} が誕生しました。`;
      state.uiTransitionLocked = false;
      continueButton.textContent = '次の人へ';
      continueButton.disabled = false;
      compareButton.hidden = false;

    } catch (err) {
      state.submitStatus = 'failed';
      authorNewsTeaser.hidden = true;
      const message = err && err.name === 'AbortError'
        ? 'サーバー応答がタイムアウトしました'
        : (err.message || err);
      evolutionStatus.textContent = `次世代の生成に失敗しました：${message}`;
      state.uiTransitionLocked = false;
      continueButton.textContent = 'もう一度送信';
      continueButton.disabled = false;
    }
  }

  function handleTap(clientX, clientY) {
    if (!state.roundActive) return;

    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (canvas.width / rect.width);
    const y = (clientY - rect.top) * (canvas.height / rect.height);

    for (const moth of state.activeMoths) {
      if (
        !moth.clicked &&
        x >= moth.x - 1 && x <= moth.x + moth.size + 1 &&
        y >= moth.y - 1 && y <= moth.y + moth.size + 1
      ) {
        moth.clicked = true;
        state.eatenIndices.add(moth.index);
        state.roundTapEvents.push({
          index: moth.index,
          elapsed_ms: Math.max(
            0,
            Math.round(performance.now() - state.roundStartedAt),
          ),
        });
        render();
        break;
      }
    }
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleTap(e.clientX, e.clientY);
  });

  startButton.addEventListener('click', () => {
    if (!state.bootReady || state.uiTransitionLocked) return;
    state.uiTransitionLocked = true;
    startButton.disabled = true;
    requestScreenWakeLock();
    startOverlay.classList.remove('visible');
    buildRounds();
    state.currentRoundIndex = 0;
    state.eatenIndices = new Set();
    state.allSurvivorIndices = [];
    state.roundRecords = [];
    state.roundTapEvents = [];
    state.runId = null;
    state.scoreRecordId = null;
    state.scoreSummary = null;
    state.submitStatus = 'idle';
    startRound();
  });

  continueButton.addEventListener('click', () => {
    if (state.uiTransitionLocked || continueButton.disabled) return;
    state.uiTransitionLocked = true;

    if (state.submitStatus === 'retry_generation') {
      reviewOverlay.classList.remove('visible');
      authorNewsTeaser.hidden = true;
      buildRounds();
      state.currentRoundIndex = 0;
      state.eatenIndices = new Set();
      state.allSurvivorIndices = [];
      state.roundRecords = [];
      state.roundTapEvents = [];
      state.runId = null;
      state.scoreRecordId = null;
      state.scoreSummary = null;
      state.nextGenerationId = null;
      state.submitStatus = 'idle';
      startRound();
      return;
    }

    if (state.submitStatus === 'stale_generation') {
      const u = new URL(location.href);
      u.searchParams.set('v', String(Date.now()));
      location.href = u.toString();
      return;
    }

    if (state.submitStatus === 'failed') {
      continueButton.disabled = true;
      continueButton.textContent = '再送中…';
      sendEvolutionData();
      return;
    }

    if (state.submitStatus !== 'success') {
      state.uiTransitionLocked = false;
      return;
    }

    const u = new URL(location.href);
    u.searchParams.set('v', String(Date.now()));
    location.href = u.toString();
  });

  rankingButton.addEventListener('click', (event) => {
    event.preventDefault();
    event.stopPropagation();
    showRanking();
  });

  rankingCloseButton.addEventListener('click', () => {
    rankingOverlay.classList.remove('visible');
  });

  saveNameButton.addEventListener('click', (event) => {
    event.preventDefault();
    saveCurrentName();
    renderRanking();
  });

  playerName.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      saveCurrentName();
      renderRanking();
    }
  });

  compareButton.addEventListener('click', (event) => {
    event.preventDefault();
    event.stopPropagation();
    showEvolutionComparison();
  });

  evolutionOverlay.addEventListener('pointerdown', () => {
    evolutionOverlay.classList.remove('visible');
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.bootReady) {
      requestScreenWakeLock();
    }
  });

  reloadButton.addEventListener('click', () => {
    location.reload();
  });

  async function boot() {
    try {
      await fetchAppConfig();
      state.currentGenerationId = await fetchCurrentGeneration();
      state.generationNumber = Number(state.currentGenerationId.slice(3));
      startGeneration.textContent = generationLabel();

      await preloadAssets();
      render();

      state.bootReady = true;
      state.uiTransitionLocked = false;
      startButton.disabled = false;
      startButton.textContent = 'はじめる';
      requestScreenWakeLock();

    } catch (err) {
      showFatal(
        '初期化に失敗しました。\n' +
        (err && err.message ? err.message : String(err)) +
        '\n\nPagesプレビューのデータを確認してください。'
      );
    }
  }

  boot();
})();
</script>
