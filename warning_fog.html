<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ギタイラボ — 世代ごとの霧実験 v2 へ</title>
  <meta http-equiv="refresh" content="0; url=./index.html?model=continuous_v1&amp;env=kusagi_001&amp;experiment=warning_color&amp;run=warning_color_fog_v2&amp;fog=1&amp;play=1&amp;launch=fog-v2-20261020-1">
</head>
<body>
  <p>霧あり実験を起動しています…</p>
  <p><a href="./index.html?model=continuous_v1&amp;env=kusagi_001&amp;experiment=warning_color&amp;run=warning_color_fog_v2&amp;fog=1&amp;play=1&amp;launch=fog-v2-20261020-1">起動しない場合はこちら</a></p>
  <script>
    // A query-free landing URL prevents chat/in-app link handlers from
    // dropping individual game-mode parameters. This also refreshes the
    // entry HTML URL, avoiding a previously opened stale game tab.
    const next = new URL('./index.html', window.location.href);
    for (const [key, value] of Object.entries({
      model: 'continuous_v1',
      env: 'kusagi_001',
      experiment: 'warning_color',
      run: 'warning_color_fog_v2',
      fog: '1',
      play: '1',
      launch: 'fog-v2-20261020-1',
    })) next.searchParams.set(key, value);
    window.location.replace(next.toString());
  </script>
</body>
</html>
